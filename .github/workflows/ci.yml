name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install server deps
        run: |
          cd server
          pip install -r requirements.txt
      - name: Lint placeholder
        run: echo "Add tests/lint here"
